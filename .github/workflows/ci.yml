name: MediCare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - patient-service
          - appointment-service
          - discovery-service
          - config-service
          - gateway-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml

      - name: Build with Maven
        working-directory: backend/${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: medic-frontend/package-lock.json

      - name: Install dependencies
        working-directory: medic-frontend
        run: npm ci

      - name: Build frontend
        working-directory: medic-frontend
        run: npm run build

  publish:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: patient-service
            context: ./backend/patient-service
          - service: appointment-service
            context: ./backend/appointment-service
          - service: config-service
            context: ./backend/config-service
          - service: discovery-service
            context: ./backend/discovery-service
          - service: gateway-service
            context: ./backend/gateway-service
          - service: medic-frontend
            context: ./medic-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max