name: MediCare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - patient-service
          - appointment-service
          - discovery-service
          - config-service
          - gateway-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml

      - name: Build with Maven
        working-directory: backend/${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: medic-frontend/package-lock.json

      - name: Install dependencies
        working-directory: medic-frontend
        run: npm ci

      - name: Build frontend
        working-directory: medic-frontend
        run: npm run build
